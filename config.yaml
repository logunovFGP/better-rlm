# RLM MCP server configuration. Values here override the baked-in defaults in src/config.py.
mode: auto                             # auto | claude-cli | api. auto: prefer the `claude` CLI
                                       # (reuses your Claude Code login — no token/API key needed),
                                       # else fall back to ANTHROPIC_API_KEY. Override per-launch
                                       # with the RLM_MODE env var. claude-cli forces the CLI; api forces the SDK.
provider: anthropic                    # anthropic — and only anthropic. Any other value raises
                                       # NotImplementedError at the first model call: the session
                                       # budget (ledger, 95% floor, resumable stop) lives in the
                                       # Anthropic transport, and the other providers kept the
                                       # engine's own client, which bypassed all three. A budget
                                       # that silently does not apply is worse than none.
                                       # anthropic also needs no API key — it uses the local
                                       # `claude` CLI login. Override: RLM_PROVIDER.
root_model: claude-sonnet-5            # default root/orchestrator (1M ctx)
root_model_override: claude-opus-4-8   # override for the hardest tasks (1M ctx)
sub_model: claude-haiku-4-5            # cheap sub-LLM for chunk work (200K ctx)
max_depth: 2
max_iterations: 20
query_timeout_s: 1800                  # wall-clock ceiling for ONE rlm_query. max_iterations
                                       # alone bounds nothing useful: 20 x cli_timeout_s 600 is
                                       # over three hours. The engine enforces it and returns the
                                       # best partial answer. 0 = unlimited.
query_max_errors: 5                    # consecutive failed iterations before the engine stops and
                                       # returns the best partial answer. 0 = unlimited.
max_output_tokens: 32768
sandbox: docker                        # docker (default, sandboxed) | local (host exec — documented risk).
                                       # Override per-launch with RLM_SANDBOX=local (e.g. when no
                                       # Docker daemon is available) — that keeps the committed
                                       # default safe. Invalid values are rejected, not degraded.
sandbox_image: rlm-sandbox
sandbox_timeout_s: 300
max_concurrent_subcalls: 2             # engine rlm_query_batched parallelism
subquery_concurrency: 3                # our map-reduce parallelism

# ---- Session-window token budget (see src/budget.py) --------------------------------
session_window_h: 5                    # the rolling window the subscription enforces
session_budget_tokens: 5800000         # tokens per window. SEED VALUE, calibrated from one
                                       # observed incident: a 103-chunk batch spending ~3.5M
                                       # tokens was reported as ~60% of a window, so ~5.8M.
                                       # It is a starting point, not a measurement — adjust it
                                       # if your plan differs. This number IS the ceiling: it is
                                       # the only thing that gates, and nothing overrides it.
                                       # 0 turns gating off — the server still estimates, logs
                                       # and reports, but refuses nothing.
                                       # When the server does hit a real usage limit it records
                                       # its own window spend at that moment and reports it
                                       # (rlm_budget). That is a FLOOR under your true ceiling,
                                       # not the ceiling — other Claude sessions spend against
                                       # the same window and are invisible here — so it is
                                       # offered as the number to set, never applied on its own.
budget_stop_fraction: 0.95             # stop a run at this share of the window budget, so it
                                       # ends by choice with its results on disk instead of
                                       # being killed mid-call with nothing to show.
report_cost: false                     # OFF by default. The rate table covers Anthropic models only,
                                       # and the claude-CLI path under-counts input tokens — so a "$"
                                       # figure would be confidently wrong. Enable only when your
                                       # models are priced in src/config.py COST_PER_MTOK.
sub_context_tokens: 0                  # context ceiling of sub_model. 0 = DERIVE it from the
                                       # engine's own model table (rlm/utils/token_utils.py), so
                                       # this stops being a second copy of that knowledge that has
                                       # to be kept in sync by hand. Any non-zero value overrides.
                                       # Derivation is CAPPED at 200K on purpose: a model's window
                                       # is a ceiling, not a target. This server scans oversized
                                       # input rather than stuffing it into the prompt, and a
                                       # near-window sub-query is worse than chunking the same
                                       # bytes. Raise it explicitly only with evidence.
output_cap_bytes: 4096                 # raw-content tools (load/inspect/chunk/grep/read/list/exec/status)
answer_cap_bytes: 131072               # synthesis tools (rlm_query/sub_query) — the answer is the deliverable
chunk_strategy: lines                  # lines | paragraphs | functions | headings | semantic | files
chunk_lines: 2000
chunk_chars: 120000                    # ~< Haiku 200K-token ceiling
chunk_overlap: 0
log_dir: ~/.rlm/logs
store_dir: ~/.rlm/contexts
sources_file: ~/.rlm/sources.yaml      # registry of named external sources (see src/sources.py):
                                       # commands an operator declares that rlm_load_source may run
                                       # — pod logs, a metrics/trace backend, a journal, an audit API.
                                       # OUTSIDE the repo on purpose, so a site's clusters, endpoints
                                       # and tooling stay out of the checkout and out of every diff.
                                       # Ships absent: no file = no sources, and none are built in.
