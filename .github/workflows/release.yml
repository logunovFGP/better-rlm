name: Release

# Two ways in, and the difference is who types the version.
#
#   git tag v0.4.0 && git push origin v0.4.0    -> verify, build, release, PyPI
#   Actions -> Release -> Run workflow          -> same, plus a dry_run option
#
# There is still deliberately NO `push: branches` and no `schedule` trigger: a
# release that fires from a merge would tag and publish whatever just landed, and a
# PyPI version number cannot be reclaimed afterwards. Pushing a version tag is an
# explicit act by a human; landing a PR is not. tests/test_release.py fails if a
# branch, a schedule, or any other trigger is ever added.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.2.0 — must equal the VERSION file'
        required: true
        type: string
      dry_run:
        description: 'Verify and build only: tag nothing, publish nothing'
        type: boolean
        default: false
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'   # v1.2.3 only — not v1.2, not v1.2.3-rc1

# One release per version at a time. Without this, two dispatches seconds apart both
# clear the "already released" gate before either has created the release, and both
# reach the one step in this workflow that cannot be undone.
concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write   # create the tag and the release; nothing else

jobs:
  verify:
    # Both platforms on purpose. The three defects found merging #2/#4/#5 were all
    # Windows-only — an exec bit os.stat cannot see, backslashes eaten by shlex.split,
    # and a test that needed a live Docker daemon — and every one of them was green on
    # Linux. A ubuntu-only gate would have signed off on all three.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv run --extra dev pytest -q

  release:
    needs: verify
    runs-on: ubuntu-latest
    env:
      # Passed as environment, never interpolated into a shell line: ${{ }} inside a run
      # block is textual substitution, so a crafted input would run as code.
      #
      # workflow_dispatch supplies a bare "1.2.3"; a tag push supplies "v1.2.3" in
      # github.ref_name. The first step below strips the prefix so every later step
      # sees one normalised form.
      VERSION: ${{ inputs.version || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0        # --generate-notes needs the history

      - uses: astral-sh/setup-uv@v6

      - name: Refuse a malformed version
        run: |
          # Strip the tag's leading v, then validate. Written back to GITHUB_ENV so
          # every step after this one compares the same bare "1.2.3" against VERSION.
          v="${VERSION#v}"
          case "$v" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::version must look like 1.2.3, got '$VERSION'"; exit 1 ;;
          esac
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Refuse a version the VERSION file does not declare
        run: |
          # VERSION is the single source: pyproject reads it via setuptools dynamic, so
          # there is no [project] version key left to parse. Plain read, no interpreter.
          declared=$(tr -d '[:space:]' < VERSION)
          if [ "$declared" != "$VERSION" ]; then
            echo "::error::VERSION declares $declared, but you asked to release $VERSION. Bump VERSION on main (then scripts/sync_version.py) so the tag and the package agree."
            exit 1
          fi

      - name: Refuse a version already released
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::error::release v$VERSION already exists"; exit 1
          fi
          # On a tag push the tag necessarily exists -- it is what triggered this run.
          # Only a manual dispatch has to refuse a tag that is already there.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] \
             && git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::tag v$VERSION already exists"; exit 1
          fi

      - run: uv build

      - name: Keep the built artifacts for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - name: Tag and publish
        if: ${{ !inputs.dry_run }}
        run: gh release create "v$VERSION" dist/* --title "v$VERSION" --generate-notes

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        run: |
          echo "Dry run: suite green on both platforms, version agrees with VERSION," >> "$GITHUB_STEP_SUMMARY"
          echo "package builds. Nothing tagged, nothing published." >> "$GITHUB_STEP_SUMMARY"
          ls -l dist >> "$GITHUB_STEP_SUMMARY"

  # PyPI. Deliberately a separate job from `release`: the GitHub release is
  # reversible (delete the release, delete the tag) and PyPI is not -- a version
  # number burned on PyPI can never be reused, even after a yank. Running it last
  # means a failure here leaves a valid GitHub release rather than a half-release.
  publish:
    needs: release
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      # Job-level permissions REPLACE the workflow-level block, so `contents: write`
      # is deliberately not restated -- this job only needs an OIDC token.
      id-token: write
    steps:
      - name: Fetch the exact artifacts the release job built
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Trusted Publishing (OIDC). No API token is stored in this repository:
      # PyPI verifies the workflow identity and mints a short-lived credential.
      # Requires a pending publisher configured once on PyPI for project
      # `better-rlm`, workflow `release.yml`, owner/repo of this repository.
      - uses: pypa/gh-action-pypi-publish@release/v1
