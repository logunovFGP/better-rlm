[project]
name = "better-rlm"
# Single source of truth: the VERSION file at the repo root. Plain text so every
# consumer reads it without importing anything -- setuptools here, better_rlm/version.py at
# runtime, scripts/sync_version.py for the plugin manifest. It was three literals
# (here 0.2.0, plugin.json 0.1.0, handshake 1.28.1 from the mcp SDK); now it is one.
dynamic = ["version"]
description = "MCP server exposing Recursive Language Models (RLM) for oversized contexts, on Anthropic models with a Docker REPL sandbox."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12,<3.15"
authors = [{ name = "Aleksandr Logunov", email = "logunov.alexander.cs@gmail.com" }]
maintainers = [{ name = "Aleksandr Logunov", email = "logunov.alexander.cs@gmail.com" }]
keywords = ["mcp", "rlm", "llm", "anthropic", "claude", "long-context", "recursive-language-model"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  # No "License :: OSI Approved :: ..." classifier: PEP 639 supersedes it with the
  # SPDX `license = "MIT"` above, and setuptools now hard-errors if both are present.
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  # The RLM engine is vendored at ./rlm (see rlm/UPSTREAM.md) — no longer a
  # dependency. These are the deps it used to pull in transitively, restated so
  # the vendored copy still resolves. Backends other than anthropic are imported
  # lazily in rlm/clients/__init__.py. They stay declared because the vendored engine
  # still SHIPS those client modules (rlm/clients/azure_openai.py imports openai at
  # module scope), and rlm/UPSTREAM.md keeps it usable standalone -- NOT because this
  # server accepts those providers: auth.require_anthropic refuses every one of them,
  # and config.yaml says so on its provider line. Do not prune these on the strength
  # of that guard; the engine, not the config surface, is what needs them.
  "anthropic>=0.75.0",
  "google-genai>=1.56.0",
  "openai>=2.14.0",
  "portkey-ai>=2.1.0",
  "requests>=2.32.5",
  "rich>=13.0.0",
  "mcp==1.28.1",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/logunovFGP/better-rlm"
Repository = "https://github.com/logunovFGP/better-rlm"
Issues = "https://github.com/logunovFGP/better-rlm/issues"
Changelog = "https://github.com/logunovFGP/better-rlm/releases"

[project.scripts]
# The operator command. In a checkout it shells out to install.sh / run_server.sh;
# installed from a wheel it runs the server in-process and reads ~/.rlm/config.yaml.
# better_rlm/cli.py owns that split -- see CLAUDE.md "Design boundary".
better-rlm = "better_rlm.cli:main"

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
dev = ["pytest>=8.0"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# `rlm*` picks up the vendored engine and its subpackages (rlm.core, rlm.clients,
# rlm.environments, rlm.logger, rlm.utils) without enumerating them by hand.
#
# The engine ships as top-level `rlm` because that is the name its own 66 absolute
# imports use, and rlm/UPSTREAM.md's merge recipe depends on the tree matching
# upstream. Upstream publishes the same import name (as the `rlms` distribution),
# so installing both into one environment is a collision -- documented in
# rlm/UPSTREAM.md rather than papered over by a rename that would break the merge.
include = ["better_rlm*", "rlm*"]

[tool.pytest.ini_options]
markers = [
    "docker: needs a running Docker daemon; excluded from the daemon-free guarantee",
    "live: makes a real model call; excluded from the no-spend guarantee",
]
